{% extends "base.html" %}

{% block title %}Notices{% endblock %}

{% block content %}
<h2>Notices</h2>
{% for notice in notices %}
<div class="card mb-3">
    <div class="card-body">
        <h5>{{ notice.title }}</h5>
        <p>{{ notice.description }}</p>
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">{{ notice.date }}</small>
            <a href="/notice/{{ notice.id }}" class="btn btn-sm btn-outline-primary">
                <i class="fas fa-eye"></i> View Details
            </a>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
