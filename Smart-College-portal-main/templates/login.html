{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-page" style="position: relative; min-height: 100vh; background-image: url('{{ url_for('static', filename='images/smd_college.jpg') }}'); background-size: cover; background-position: center; background-repeat: no-repeat; display: flex; align-items: center; justify-content: flex-end;">
    <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.25);"></div>
    <div class="login-form-wrapper" style="position: relative; z-index: 1; width: 90%; max-width: 360px; margin-right: 4%; padding: 28px 26px; background: rgba(255, 255, 255, 0.95); border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);">
        <div class="text-center mb-4">
            <h2 class="mt-3" style="color: #222;">Welcome Back</h2>
            <p class="text-muted">Smart College Portal Management System</p>
        </div>
        <form method="post" class="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
            </div>
            <div class="mb-4">
                <label for="role" class="form-label">Login As</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="">Select Role</option>
                    <option value="admin">Administrator</option>
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Sign In</button>
        </form>
        <div class="text-center">
            <a href="/" class="btn btn-outline-secondary">← Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
