{% extends "base.html" %}

{% block title %}Upload Results{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Upload Exam Results</h2>
    <p class="text-muted">Enter marks for students</p>
</div>
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="student_id" class="form-label">
                            <i class="fas fa-user"></i> Select Student
                        </label>
                        <select name="student_id" class="form-control" id="student_id" required>
                            <option value="">Choose a student...</option>
                            {% for student in students %}
                            <option value="{{ student.id }}">{{ student.name }} ({{ student.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">
                            <i class="fas fa-book"></i> Subject
                        </label>
                        <input type="text" name="subject" class="form-control" id="subject" required placeholder="Enter subject name">
                    </div>
                    <div class="mb-4">
                        <label for="marks" class="form-label">
                            <i class="fas fa-star"></i> Marks Obtained
                        </label>
                        <input type="number" name="marks" class="form-control" id="marks" required min="0" max="100" placeholder="Enter marks (0-100)">
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/dashboard" class="btn btn-outline-secondary me-md-2">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload"></i> Upload Result
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="text-center mt-4">
    <a href="/dashboard" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
