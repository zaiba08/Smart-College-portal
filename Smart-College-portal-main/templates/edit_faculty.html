{% extends "base.html" %}

{% block title %}Edit Faculty{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Edit Faculty</h2>
    <p class="text-muted">Update faculty member details</p>
</div>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" value="{{ faculty.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ faculty.email }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" value="{{ faculty.password }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" name="subject" value="{{ faculty.subject }}" required>
                </div>
            </div>
            <div class="mt-4 d-flex justify-content-between">
                <a href="/admin/faculty" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Faculty
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
